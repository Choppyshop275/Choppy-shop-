<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choppy Shop</title>
  <style>
    body { font-family: Arial; margin: 0; background: #f5f5f5; }
    header { background: #111; color: white; padding: 20px; text-align: center; }
    .container { padding: 20px; }
    .product {
      background: white;
      padding: 15px;
      margin: 15px 0;
      border-radius: 12px;
    }
    button {
      background: #111;
      color: white;
      border: 0;
      padding: 12px 18px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🛍️ Choppy Shop</h1>
    <p>Tech & Clothes</p>
  </header>

  <div class="container">
    <h2>Our Products</h2>

    <div class="product">
      <h3>Men's Boxers</h3>
      <p>K100</p>
      <button>Order</button>
    </div>

    <div class="product">
      <h3>Sweat Pants</h3>
      <p>K100</p>
      <button>Order</button>
    </div>

    <div class="product">
      <h3>Android Cable</h3>
      <p>K50</p>
      <button>Order</button>
    </div>
  </div>
</body>
</html>
